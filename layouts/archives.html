{{ define "main" }}
<header class="mt-8 mb-10">
  <h1 class="text-4xl font-extrabold">{{ .Title }}</h1>
  <p class="mt-4 text-neutral-500 dark:text-neutral-400">按时间回看，每一篇记录都是一个脚印。</p>
</header>
{{ range (where site.RegularPages "Section" "posts").GroupByDate "2006" }}
<section class="archive-year">
  <h2 class="text-2xl font-bold">{{ .Key }} <span class="text-base font-normal text-neutral-500">/ {{ len .Pages }} 篇</span></h2>
  {{ range .Pages }}
  <div class="archive-row">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "01 / 02" }}</time>
    <a class="text-lg font-medium hover:text-primary-500" href="{{ .RelPermalink }}">{{ .Title }}</a>
  </div>
  {{ end }}
</section>
{{ end }}
{{ end }}
