{{- if .Param "math" }}
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
  options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
  startup: { typeset: true }
};
</script>
<script defer src="{{ "vendor/mathjax/tex-mml-chtml.js" | relURL }}"></script>
{{- end }}
