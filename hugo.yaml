baseURL: "https://frodo2875.github.io/xinghao.github.io/"
title: "Xinghao's Blog"
theme: PaperMod
languageCode: zh-CN
defaultContentLanguage: zh
hasCJKLanguage: true
timeZone: Asia/Shanghai
enableRobotsTXT: true
enableEmoji: true
pagination:
  pagerSize: 6
taxonomies:
  category: categories
  tag: tags
outputs:
  home: [HTML, RSS, JSON]
params:
  env: production
  description: "Xinghao 的个人博客，记录技术学习、项目实践与日常思考。"
  author: Xinghao
  defaultTheme: auto
  mainSections: [posts]
  DateFormat: "2006 年 01 月 02 日"
  ShowReadingTime: true
  ShowWordCount: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: true
  disableSpecial1stPost: true
  comments: false
  assets:
    favicon: favicon.svg
    favicon16x16: favicon-16x16.png
    favicon32x32: favicon-32x32.png
    apple_touch_icon: apple-touch-icon.png
    safari_pinned_tab: favicon.svg
    disableHLJS: true
  homeInfoParams:
    Title: "你好，我是 Xinghao 👋"
    Content: |
      学习，构建，记录。

      这里是我的数字笔记本，收集技术探索、项目实践，以及值得留下的日常思考。

      [浏览文章](posts/) · [按时间归档](archives/) · [关于我](about/)
  socialIcons:
    - name: github
      url: https://github.com/Frodo2875
    - name: rss
      url: index.xml
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    threshold: 0.35
    minMatchCharLength: 1
    keys: [title, permalink, summary, content]
menu:
  main:
    - {name: 首页, pageRef: /, weight: 10}
    - {name: 归档, pageRef: /archives, weight: 20}
    - {name: 分类, pageRef: /categories, weight: 30}
    - {name: 标签, pageRef: /tags, weight: 40}
    - {name: 搜索, pageRef: /search, weight: 50}
    - {name: 关于, pageRef: /about, weight: 60}
markup:
  goldmark:
    renderer:
      unsafe: false
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['$$', '$$'], ['\[', '\]']]
          inline: [['$', '$'], ['\(', '\)']]
  highlight:
    style: monokai
    lineNos: false
