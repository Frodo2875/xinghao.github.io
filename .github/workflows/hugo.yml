name: Build and deploy Xinghao Blog
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
env:
  TZ: Asia/Shanghai
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install verified Hugo binary
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < .hugo-version)"
          ARCHIVE="hugo_extended_${VERSION}_linux-amd64.tar.gz"
          RELEASE="https://github.com/gohugoio/hugo/releases/download/v${VERSION}"
          mkdir -p "$RUNNER_TEMP/hugo"
          cd "$RUNNER_TEMP/hugo"
          curl --fail --location --retry 3 "$RELEASE/$ARCHIVE" -o "$ARCHIVE"
          curl --fail --location --retry 3 "$RELEASE/hugo_${VERSION}_checksums.txt" -o checksums.txt
          grep " ${ARCHIVE}$" checksums.txt | sha256sum --check -
          tar -xzf "$ARCHIVE"
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - name: Build pull request
        if: github.event_name == 'pull_request'
        run: hugo --gc --minify --baseURL https://example.org/
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build for Pages URL
        if: github.event_name != 'pull_request'
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --gc --minify --baseURL "${SITE_URL}/"
      - name: Check internal links and assets
        if: github.event_name != 'pull_request'
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/check-output.py public "${SITE_URL}/"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
