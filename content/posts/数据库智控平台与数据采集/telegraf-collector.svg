<text x='112' y='230' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>[agent] / [[inputs.*]] / [[processors.*]] / [[aggregators.*]] / [[outputs.*]]</text>
