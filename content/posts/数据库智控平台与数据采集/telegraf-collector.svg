<text x='447' y='494' font-family='Microsoft YaHei,Arial,sans-serif' font-size='28' font-weight='700' fill='#5C3A77'>Accumulator</text>
<text x='447' y='535' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>统一 Metric</text>
<text x='447' y='569' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>时间戳 / 标签 / 字段</text>
<rect x='760' y='450' width='285' height='170' rx='18' fill='#FEFCFF' stroke='#D9C3E9' stroke-width='2'/>
<text x='782' y='494' font-family='Microsoft YaHei,Arial,sans-serif' font-size='28' font-weight='700' fill='#5C3A77'>处理器（可选）</text>
<text x='782' y='535' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>Processors</text>
<text x='782' y='569' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>rename / converter</text>
