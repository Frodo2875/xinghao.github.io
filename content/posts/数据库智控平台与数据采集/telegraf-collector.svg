<text x='112' y='533' font-family='Microsoft YaHei,Arial,sans-serif' font-size='22' font-weight='400' fill='#776783'>Gather / ServiceInput</text>
<text x='112' y='569' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>数据库 / 系统 / 端点</text>
