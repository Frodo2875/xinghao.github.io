<rect x='930' y='750' width='490' height='175' rx='18' fill='#FEFCFF' stroke='#D9C3E9' stroke-width='2'/>
<text x='952' y='794' font-family='Microsoft YaHei,Arial,sans-serif' font-size='28' font-weight='700' fill='#5C3A77'>指标分发 · Fan-out</text>
<text x='952' y='835' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>按输出过滤规则分发</text>
<text x='952' y='869' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>聚合后可再次运行处理器</text>
<rect x='90' y='750' width='730' height='175' rx='18' fill='#EFE0FA' stroke='#BE8BE0' stroke-width='2'/>
<text x='112' y='794' font-family='Microsoft YaHei,Arial,sans-serif' font-size='28' font-weight='700' fill='#5C3A77'>各输出独立缓冲 · RunningOutput</text>
<text x='112' y='835' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>metric_buffer_limit · memory / disk</text>
<text x='112' y='869' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>metric_batch_size · flush_interval / flush_jitter</text>
<text x='112' y='903' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>写入失败保留待重试 · 缓冲容量受限</text>
<polyline points='1257,620 1257,750' fill='none' stroke='#A982C2' stroke-width='3' />
<polygon points='1257,750 1263,737 1251,737' fill='#A982C2'/>
<polyline points='930,835 820,835' fill='none' stroke='#A982C2' stroke-width='3' />
<polygon points='820,835 833,841 833,829' fill='#A982C2'/>
<text x='92' y='985' font-family='Microsoft YaHei,Arial,sans-serif' font-size='25' font-weight='400' fill='#8B729C'>处理器、聚合器按配置启用；未配置时直接向下游传递</text>
<text x='1530' y='104' font-family='Microsoft YaHei,Arial,sans-serif' font-size='34' font-weight='700' fill='#5C3A77'>输入插件与采集方式</text>
<rect x='1530' y='145' width='820' height='110' rx='18' fill='#FEFCFF' stroke='#D9C3E9' stroke-width='2'/>
<text x='1552' y='189' font-family='Microsoft YaHei,Arial,sans-serif' font-size='28' font-weight='700' fill='#5C3A77'>主机 · 本地系统接口</text>
<text x='1552' y='230' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>inputs.cpu / mem / disk / net / system</text>
<rect x='1530' y='275' width='820' height='110' rx='18' fill='#FEFCFF' stroke='#D9C3E9' stroke-width='2'/>
<text x='1552' y='319' font-family='Microsoft YaHei,Arial,sans-serif' font-size='28' font-weight='700' fill='#5C3A77'>数据库 · 专用插件与驱动</text>
<text x='1552' y='360' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>inputs.mysql / postgresql / sqlserver / redis</text>
<rect x='1530' y='405' width='820' height='145' rx='18' fill='#FEFCFF' stroke='#D9C3E9' stroke-width='2'/>
<text x='1552' y='449' font-family='Microsoft YaHei,Arial,sans-serif' font-size='28' font-weight='700' fill='#5C3A77'>自定义 SQL · inputs.sql</text>
<text x='1552' y='490' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>Go SQL 驱动 + DSN + 查询 / 列映射</text>
<text x='1552' y='524' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>连接数限制 / 查询超时</text>
<rect x='1530' y='570' width='820' height='110' rx='18' fill='#FEFCFF' stroke='#D9C3E9' stroke-width='2'/>
<text x='1552' y='614' font-family='Microsoft YaHei,Arial,sans-serif' font-size='28' font-weight='700' fill='#5C3A77'>设备、端点与脚本</text>
<text x='1552' y='655' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>inputs.snmp / prometheus / http / exec</text>
<text x='1530' y='752' font-family='Microsoft YaHei,Arial,sans-serif' font-size='32' font-weight='700' fill='#5C3A77'>输出与长期存储 · 按需选用</text>
<rect x='1530' y='785' width='820' height='100' rx='18' fill='#FEFCFF' stroke='#D9C3E9' stroke-width='2'/>
<text x='1552' y='826' font-family='Microsoft YaHei,Arial,sans-serif' font-size='25' font-weight='700' fill='#5C3A77'>outputs.http → HTTP(S) 接收服务 → 数据库</text>
<text x='1552' y='870' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>格式可选 prometheusremotewrite / JSON 等</text>
<rect x='1530' y='905' width='820' height='100' rx='18' fill='#FEFCFF' stroke='#D9C3E9' stroke-width='2'/>
<text x='1552' y='946' font-family='Microsoft YaHei,Arial,sans-serif' font-size='25' font-weight='700' fill='#5C3A77'>其他输出：InfluxDB / OpenTSDB / 指标暴露</text>
<text x='1552' y='990' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>按插件选协议；不是默认经 Kafka；OB 业务表需适配</text>
<polyline points='450,925 450,1040 1500,1040 1500,835 1530,835' fill='none' stroke='#A982C2' stroke-width='3' />
<polygon points='1530,835 1517,829 1517,841' fill='#A982C2'/>
<polyline points='1500,955 1530,955' fill='none' stroke='#A982C2' stroke-width='3' />
<polygon points='1530,955 1517,949 1517,961' fill='#A982C2'/>
<path d='M50 1080 H2350' stroke='#E4D5ED' stroke-width='2'/>
<rect x='60' y='1120' width='720' height='365' rx='18' fill='#EFE0FA' stroke='#BE8BE0' stroke-width='2'/>
<text x='82' y='1164' font-family='Microsoft YaHei,Arial,sans-serif' font-size='28' font-weight='700' fill='#5C3A77'>采集开销 · 周期 / 错峰 / SQL</text>
<text x='82' y='1205' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>interval / collection_jitter / offset</text>
<text x='82' y='1239' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>专用数据库插件或 inputs.sql</text>
<text x='82' y='1273' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>inputs.sql：连接数限制、查询超时</text>
<text x='82' y='1307' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>查询语句与目标权限仍需自行核实</text>
<text x='82' y='1341' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>开源 Agent 不自带统一采控管理平台</text>
<rect x='840' y='1120' width='720' height='365' rx='18' fill='#EFE0FA' stroke='#BE8BE0' stroke-width='2'/>
<text x='862' y='1164' font-family='Microsoft YaHei,Arial,sans-serif' font-size='28' font-weight='700' fill='#5C3A77'>传输开销 · 批量 / 刷新 / 重试</text>
<text x='862' y='1205' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>metric_batch_size：发送批量</text>
<text x='862' y='1239' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>flush_interval / flush_jitter：发送节奏</text>
<text x='862' y='1273' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>outputs.http：HTTP(S) + 所选数据格式</text>
<text x='862' y='1307' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>Remote Write 格式：Protobuf + Snappy</text>
<text x='862' y='1341' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>确认范围由输出插件及接收端决定</text>
<rect x='1620' y='1120' width='720' height='365' rx='18' fill='#EFE0FA' stroke='#BE8BE0' stroke-width='2'/>
<text x='1642' y='1164' font-family='Microsoft YaHei,Arial,sans-serif' font-size='28' font-weight='700' fill='#5C3A77'>存储开销 · 各输出独立缓冲</text>
<text x='1642' y='1205' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>memory / disk 缓冲策略，按版本启用</text>
<text x='1642' y='1239' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>metric_buffer_limit：待发送数据上限</text>
<text x='1642' y='1273' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>成功清理；可重试失败保留至后续发送</text>
<text x='1642' y='1307' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>容量、错误类型和磁盘故障仍可能致丢失</text>
<text x='1642' y='1341' font-family='Microsoft YaHei,Arial,sans-serif' font-size='24' font-weight='400' fill='#776783'>长期保存由外部数据库负责；OB 需适配</text>
</svg>